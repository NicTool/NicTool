name: CI (Perl floor)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-perl-floor.yml'
      - 'client/**'
      - 'server/**'
      - 'Makefile.PL'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Floor + intermediates + latest. The floor cell tracks $min in
        # server/xt/minimum_version.t and MIN_PERL_VERSION in the four
        # Makefile.PL files; they all move together when the floor bumps.
        perl-version: ['5.22', '5.30', '5.36', 'latest']
    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Test::MinimumVersion
        run: cpanm -n Test::MinimumVersion

      - name: Build server (with deps)
        run: |
          cd server
          perl Makefile.PL
          cpanm -n --installdeps .
          make

      - name: Build client (with deps)
        run: |
          cd client
          perl Makefile.PL
          cpanm -n --installdeps .
          make

      # The full `make test` recurses into integration tests that need a
      # running NicToolServer + MySQL + a test.cfg created by
      # dist/setup/setup-test-env.pl. That whole stack runs in ci.yml
      # against bookworm; reproducing it across the Perl matrix is more
      # cost than value. Here we only need the things `make test` would
      # catch that are *actually Perl-version-sensitive*:
      #   - syntax/compile (the existing 00-/01-syntax.t do `perl -c`)
      #   - the new minimum-version PPI scan
      # The earlier `make` step already exercises the build harness; the
      # `cpanm --installdeps` step already gates CPAN deps that pin a
      # too-new Perl.
      - name: Run syntax + minimum-Perl checks
        run: |
          cd server
          prove -v t/00-syntax.t api/t/00-syntax.t xt/minimum_version.t
          cd ../client
          prove -v t/01-syntax.t
